<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정화정 — 졸지말고 일해</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;600;700;900&display=swap');

  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; }
  body {
    overflow:hidden;
    font-family:'Noto Sans KR', sans-serif;
    background:#050509;
    color:#fff;
  }

  /* 움직이는 배경 */
  .scene {
    position:relative;
    width:100vw;
    height:100vh;
    display:grid;
    place-items:center;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 45%, rgba(112,58,255,.18), transparent 28%),
      radial-gradient(circle at 15% 20%, rgba(0,229,255,.12), transparent 25%),
      radial-gradient(circle at 85% 80%, rgba(255,0,128,.10), transparent 28%),
      #050509;
  }

  .grid {
    position:absolute;
    inset:-50%;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:55px 55px;
    transform:perspective(500px) rotateX(62deg) translateY(30%);
    animation:gridMove 9s linear infinite;
    mask-image:linear-gradient(to top, rgba(0,0,0,1), transparent 75%);
  }
  @keyframes gridMove {
    from { background-position:0 0,0 0; }
    to { background-position:0 550px,550px 0; }
  }

  .orb {
    position:absolute;
    border-radius:50%;
    filter:blur(2px);
    opacity:.55;
    animation:float 7s ease-in-out infinite;
  }
  .orb.one {
    width:260px;height:260px;left:5%;top:8%;
    background:radial-gradient(circle at 35% 30%, #8b5cff, #2d0d80 45%, transparent 70%);
  }
  .orb.two {
    width:320px;height:320px;right:2%;bottom:-5%;
    background:radial-gradient(circle at 35% 30%, #00e5ff, #003c88 45%, transparent 70%);
    animation-delay:-3s;
  }
  .orb.three {
    width:190px;height:190px;right:20%;top:5%;
    background:radial-gradient(circle at 35% 30%, #ff4fb3, #71002f 45%, transparent 70%);
    animation-delay:-1.5s;
  }
  @keyframes float {
    50% { transform:translate(30px,-35px) scale(1.08); }
  }

  /* 파티클 */
  .particles { position:absolute; inset:0; pointer-events:none; }
  .particles i {
    position:absolute;
    width:3px;height:3px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 12px #fff;
    opacity:.5;
    animation:twinkle var(--d) ease-in-out infinite;
    animation-delay:var(--delay);
  }
  @keyframes twinkle {
    0%,100% { opacity:.08; transform:scale(.5); }
    50% { opacity:.9; transform:scale(1.7); }
  }

  .card {
    position:relative;
    z-index:5;
    width:min(920px, 88vw);
    padding:72px 70px 62px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:34px;
    background:linear-gradient(135deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
    backdrop-filter:blur(24px) saturate(150%);
    -webkit-backdrop-filter:blur(24px) saturate(150%);
    box-shadow:
      0 35px 100px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,255,255,.18),
      0 0 80px rgba(111,67,255,.12);
    text-align:center;
    overflow:hidden;
    animation:cardIn 1s cubic-bezier(.16,1,.3,1) both;
  }
  .card::before {
    content:"";
    position:absolute;
    width:480px;height:480px;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    background:conic-gradient(from 0deg, transparent, rgba(0,229,255,.13), transparent, rgba(255,0,153,.13), transparent);
    animation:spin 12s linear infinite;
    pointer-events:none;
  }
  .card::after {
    content:"";
    position:absolute;
    inset:1px;
    border-radius:33px;
    background:rgba(5,5,12,.58);
    z-index:-1;
  }
  @keyframes spin { to { transform:translate(-50%,-50%) rotate(360deg); } }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(45px) scale(.94); filter:blur(12px); }
    to { opacity:1; transform:none; filter:none; }
  }

  .badge {
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:10px 18px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:999px;
    background:rgba(255,255,255,.06);
    color:#b9c7ff;
    font-size:13px;
    font-weight:700;
    letter-spacing:.15em;
    text-transform:uppercase;
    box-shadow:0 0 30px rgba(94,87,255,.15);
    animation:pulse 2.4s ease-in-out infinite;
  }
  .badge::before {
    content:"";
    width:7px;height:7px;border-radius:50%;
    background:#55ffb1;
    box-shadow:0 0 14px #55ffb1;
  }
  @keyframes pulse {
    50% { box-shadow:0 0 40px rgba(94,87,255,.28); }
  }

  h1 {
    position:relative;
    margin:28px 0 5px;
    font-family:'Black Han Sans', sans-serif;
    font-size:clamp(58px, 10vw, 122px);
    line-height:.95;
    letter-spacing:-.055em;
    background:linear-gradient(105deg,#fff 10%,#c5c9ff 35%,#8e5cff 58%,#00e5ff 82%,#fff);
    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 45px rgba(126,91,255,.2);
    animation:shine 4s linear infinite;
  }
  @keyframes shine { to { background-position:300% center; } }

  .subtitle {
    position:relative;
    margin:18px 0 34px;
    color:#a7a9bb;
    font-size:clamp(14px,2vw,18px);
    letter-spacing:.12em;
  }

  .message {
    position:relative;
    display:inline-block;
    padding:18px 28px;
    border-radius:18px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.12);
    font-size:18px;
    font-weight:700;
    color:#f4f4ff;
  }
  .message strong {
    color:#00e5ff;
    text-shadow:0 0 18px rgba(0,229,255,.7);
  }

  .cta {
    position:relative;
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:34px;
    flex-wrap:wrap;
  }
  button {
    border:0;
    cursor:pointer;
    color:#fff;
    font:700 15px 'Noto Sans KR',sans-serif;
    padding:14px 25px;
    border-radius:14px;
    background:linear-gradient(135deg,#744cff,#3c9cff);
    box-shadow:0 10px 35px rgba(91,76,255,.35);
    transition:.25s ease;
  }
  button:hover { transform:translateY(-4px) scale(1.03); box-shadow:0 15px 45px rgba(0,195,255,.3); }
  button:active { transform:scale(.97); }

  .clock {
    position:relative;
    margin-top:28px;
    color:#686b7c;
    font-size:12px;
    letter-spacing:.16em;
  }

  .scanline {
    position:absolute;
    left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(0,229,255,.45),transparent);
    box-shadow:0 0 15px rgba(0,229,255,.3);
    animation:scan 5s ease-in-out infinite;
    opacity:.35;
  }
  @keyframes scan {
    0% { top:-5%; } 50% { top:105%; } 100% { top:105%; }
  }

  .flash {
    position:fixed;
    inset:0;
    z-index:20;
    background:#fff;
    pointer-events:none;
    opacity:0;
  }
  .flash.go { animation:flash .45s ease-out; }
  @keyframes flash {
    0% { opacity:.8; } 100% { opacity:0; }
  }

  @media(max-width:600px) {
    .card { padding:52px 24px 45px; border-radius:25px; }
    .card::after { border-radius:24px; }
    h1 { font-size:60px; }
    .message { font-size:15px; }
  }
</style>
</head>
<body>
<div class="scene">
  <div class="grid"></div>
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>
  <div class="particles" id="particles"></div>
  <div class="scanline"></div>

  <main class="card">
    <div class="badge">SYSTEM ALERT · WORK MODE</div>

    <h1>정화정</h1>
    <div class="subtitle">지금부터 집중 모드가 시작됩니다.</div>

    <div class="message">
      😴 <span>졸지 말고</span> <strong>일해.</strong> ⚡
    </div>

    <div class="cta">
      <button id="wakeBtn">⚡ 정신 차리기</button>
      <button id="workBtn">🚀 업무 시작</button>
    </div>

    <div class="clock" id="clock">FOCUS SYSTEM INITIALIZING...</div>
  </main>

  <div class="flash" id="flash"></div>
</div>

<script>
  // 별빛 파티클 생성
  const particleBox = document.getElementById('particles');
  for (let i = 0; i < 90; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.setProperty('--d', (2 + Math.random() * 5) + 's');
    p.style.setProperty('--delay', (-Math.random() * 5) + 's');
    p.style.transform = `scale(${0.5 + Math.random() * 1.5})`;
    particleBox.appendChild(p);
  }

  // 실시간 시계
  const clock = document.getElementById('clock');
  function updateClock() {
    const now = new Date();
    clock.textContent =
      'FOCUS MODE  ·  ' +
      now.toLocaleTimeString('ko-KR', {hour12:false});
  }
  updateClock();
  setInterval(updateClock, 1000);

  const flash = document.getElementById('flash');

  // 정신 차리기 버튼
  document.getElementById('wakeBtn').addEventListener('click', () => {
    flash.classList.remove('go');
    void flash.offsetWidth;
    flash.classList.add('go');

    document.querySelector('.card').animate([
      { transform:'scale(1)' },
      { transform:'scale(1.035) rotate(.4deg)' },
      { transform:'scale(1)' }
    ], {duration:420, easing:'cubic-bezier(.2,.9,.2,1)'});
  });

  // 업무 시작 버튼
  document.getElementById('workBtn').addEventListener('click', () => {
    document.querySelector('.message span').textContent = '좋아. 이제';
    document.querySelector('.message strong').textContent = ' 일하자!';
    document.querySelector('.message strong').style.color = '#55ffb1';
    document.querySelector('.message strong').style.textShadow = '0 0 20px rgba(85,255,177,.75)';
  });
</script>
</body>
</html>
